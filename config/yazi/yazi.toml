[manager]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_hidden    = false

[preview]
image_filter  = "triangle"
image_quality = 75

[opener]
pdf = [
  { run = 'open -a "Google Chrome" "$@"', desc = "Chrome", orphan = true },
]

[open]
rules = [
  { mime = "application/pdf", use = "pdf" },
  { mime = "*/pdf",           use = "pdf" },
]
