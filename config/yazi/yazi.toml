[manager]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
show_hidden    = false

[preview]
image_filter  = "triangle"
image_quality = 75

[opener]
pdf = [
  { run = 'open -a "Google Chrome" "$@"', desc = "Chrome", orphan = true },
]
video = [
  { run = 'open -a VLC "$@"', desc = "VLC", orphan = true },
]

[open]
rules = [
  { mime = "application/pdf", use = "pdf" },
  { mime = "*/pdf",           use = "pdf" },
  { mime = "video/*",         use = "video" },
  { mime = "application/vnd.rn-realmedia*", use = "video" },
]
